name: probe bond lending
on:
  push:
    branches: [probe-bond-lending]
    paths: [".probe/*.mjs", ".github/workflows/probe-bl.yml", "scripts/fetch-bond-lending.mjs"]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node .probe/probe.mjs > .probe/out.txt 2>&1 || true
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .probe/out.txt data/bond-lending.json; git commit -qm "probe output"; git push
