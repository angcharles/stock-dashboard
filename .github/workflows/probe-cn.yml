name: probe-cn
on:
  push:
    branches: [probe-cn]
    paths: [scripts/fetch-cgb-master.mjs, scripts/fetch-china.mjs, .github/workflows/probe-cn.yml]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: (node scripts/fetch-cgb-master.mjs --full && node scripts/fetch-china.mjs) > probe-out.txt 2>&1 || true
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f probe-out.txt data/cgb-master.json data/china.json; git commit -m "probe output" && git push
