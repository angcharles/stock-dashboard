name: Refresh price and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Every 10 minutes across US market hours (covers both EDT and EST), Mon–Fri, UTC
    - cron: "*/10 13-20 * * 1-5"
    # One run after the close to lock in the closing price
    - cron: "20 21 * * 1-5"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch latest ARM quote
        run: node scripts/fetch-quote.mjs

      - name: Assemble site
        run: |
          mkdir -p _site/data
          cp index.html .nojekyll _site/
          cp data/*.json _site/data/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
