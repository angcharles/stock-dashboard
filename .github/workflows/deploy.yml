name: Refresh price and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Every 10 minutes across US market hours (covers both EDT and EST), Mon–Fri, UTC
    - cron: "*/10 13-20 * * 1-5"
    # One run after the close to lock in the closing price
    - cron: "20 21 * * 1-5"
    # Hourly, every day, to refresh the news feed (also covers weekends)
    - cron: "35 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch latest quotes
        run: |
          node scripts/fetch-quote.mjs ARM arm/data 1y
          node scripts/fetch-quote.mjs TSLA tesla/data 2y
          node scripts/fetch-quote.mjs SNDK sndk/data 2y
          node scripts/fetch-quote.mjs INTC intc/data 2y
          node scripts/fetch-quote.mjs SPCX spcx/data 1y
          node scripts/fetch-quote.mjs MU mu/data 2y
          node scripts/fetch-quote.mjs LITE lite/data 2y
          node scripts/fetch-quote.mjs COHR cohr/data 2y
          node scripts/fetch-quote.mjs GOOGL googl/data 2y
          node scripts/fetch-quote.mjs META meta/data 2y
          node scripts/fetch-quote.mjs NVDA nvda/data 2y
          node scripts/fetch-quote.mjs ZS zs/data 2y
          node scripts/fetch-quote.mjs BE be/data 2y
          node scripts/fetch-quote.mjs AAOI aaoi/data 2y
          node scripts/fetch-quote.mjs AMD amd/data 2y
          node scripts/fetch-quote.mjs MP mp/data 2y
          node scripts/fetch-quote.mjs AMZN amzn/data 2y
          node scripts/fetch-quote.mjs MSFT msft/data 2y

      - name: Fetch latest news
        run: node scripts/fetch-news.mjs

      - name: Assemble site
        run: |
          mkdir -p _site/arm/data
          cp index.html .nojekyll _site/
          mkdir -p _site/data
          cp data/news.json _site/data/
          mkdir -p _site/assets
          cp assets/*.js assets/*.css _site/assets/
          cp arm/index.html arm/fcf-data.js _site/arm/
          cp arm/data/*.json _site/arm/data/
          mkdir -p _site/tesla/data
          cp tesla/index.html tesla/fcf-data.js _site/tesla/
          cp tesla/data/*.json _site/tesla/data/
          mkdir -p _site/sndk/data
          cp sndk/index.html sndk/fcf-data.js _site/sndk/
          cp sndk/data/*.json _site/sndk/data/
          mkdir -p _site/intc/data
          cp intc/index.html intc/fcf-data.js _site/intc/
          cp intc/data/*.json _site/intc/data/
          mkdir -p _site/spcx/data
          cp spcx/index.html spcx/fcf-data.js _site/spcx/
          cp spcx/data/*.json _site/spcx/data/
          mkdir -p _site/mu/data
          cp mu/index.html mu/fcf-data.js _site/mu/
          cp mu/data/*.json _site/mu/data/
          mkdir -p _site/lite/data
          cp lite/index.html lite/fcf-data.js _site/lite/
          cp lite/data/*.json _site/lite/data/
          mkdir -p _site/cohr/data
          cp cohr/index.html cohr/fcf-data.js _site/cohr/
          cp cohr/data/*.json _site/cohr/data/
          mkdir -p _site/googl/data
          cp googl/index.html googl/fcf-data.js _site/googl/
          cp googl/data/*.json _site/googl/data/
          mkdir -p _site/meta/data
          cp meta/index.html meta/fcf-data.js _site/meta/
          cp meta/data/*.json _site/meta/data/
          mkdir -p _site/nvda/data
          cp nvda/index.html nvda/fcf-data.js _site/nvda/
          cp nvda/data/*.json _site/nvda/data/
          mkdir -p _site/zs/data
          cp zs/index.html zs/fcf-data.js _site/zs/
          cp zs/data/*.json _site/zs/data/
          mkdir -p _site/be/data
          cp be/index.html be/fcf-data.js _site/be/
          cp be/data/*.json _site/be/data/
          mkdir -p _site/aaoi/data
          cp aaoi/index.html aaoi/fcf-data.js _site/aaoi/
          cp aaoi/data/*.json _site/aaoi/data/
          mkdir -p _site/amd/data
          cp amd/index.html amd/fcf-data.js _site/amd/
          cp amd/data/*.json _site/amd/data/
          mkdir -p _site/mp/data
          cp mp/index.html mp/fcf-data.js _site/mp/
          cp mp/data/*.json _site/mp/data/
          mkdir -p _site/amzn/data
          cp amzn/index.html amzn/fcf-data.js _site/amzn/
          cp amzn/data/*.json _site/amzn/data/
          mkdir -p _site/msft/data
          cp msft/index.html msft/fcf-data.js _site/msft/
          cp msft/data/*.json _site/msft/data/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
