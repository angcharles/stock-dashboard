name: Refresh price and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  # The data workflow commits with the Actions token, which does not trigger a push run,
  # so republish whenever it finishes (otherwise new portfolio data waits for the next cron).
  workflow_run:
    workflows: ["Save daily prices for the technical read"]
    types: [completed]
  # Price refreshes (10 min regular hours, 15 min pre/after/overnight) are dispatched by
  # heartbeat.yml, because GitHub was dropping most of this workflow's own cron runs.
  schedule:
    # Hourly fallback in case the heartbeat chain is down
    - cron: "35 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch latest quotes
        run: |
          node scripts/fetch-quote.mjs ARM arm/data 2y
          node scripts/fetch-quote.mjs TSLA tesla/data 2y
          node scripts/fetch-quote.mjs SNDK sndk/data 2y
          node scripts/fetch-quote.mjs INTC intc/data 2y
          node scripts/fetch-quote.mjs SPCX spcx/data 2y
          node scripts/fetch-quote.mjs MU mu/data 2y
          node scripts/fetch-quote.mjs LITE lite/data 2y
          node scripts/fetch-quote.mjs COHR cohr/data 2y
          node scripts/fetch-quote.mjs GOOGL googl/data 2y
          node scripts/fetch-quote.mjs META meta/data 2y
          node scripts/fetch-quote.mjs NVDA nvda/data 2y
          node scripts/fetch-quote.mjs ZS zs/data 2y
          node scripts/fetch-quote.mjs BE be/data 2y
          node scripts/fetch-quote.mjs AAOI aaoi/data 2y
          node scripts/fetch-quote.mjs AMD amd/data 2y
          node scripts/fetch-quote.mjs MP mp/data 2y
          node scripts/fetch-quote.mjs AMZN amzn/data 2y
          node scripts/fetch-quote.mjs MSFT msft/data 2y
          node scripts/fetch-quote.mjs MRVL mrvl/data 2y
          node scripts/fetch-quote.mjs SKHY skhy/data 2y
          node scripts/fetch-quote.mjs 000660.KS skhy/data/krx 2y
          node scripts/fetch-quote.mjs TSM tsm/data 2y
          node scripts/fetch-quote.mjs AVGO avgo/data 2y
          node scripts/fetch-quote.mjs ROK rok/data 2y
          node scripts/fetch-quote.mjs AMAT amat/data 2y
          node scripts/fetch-quote.mjs ASML asml/data 2y
          node scripts/fetch-quote.mjs PLTR pltr/data 2y
          node scripts/fetch-quote.mjs GLW glw/data 2y
          node scripts/fetch-quote.mjs TER ter/data 2y

      - name: Fetch option chains
        run: node scripts/fetch-options.mjs chain

      - name: Fetch latest news
        run: node scripts/fetch-news.mjs

      - name: Fetch macro prices, calendar and news
        run: |
          node scripts/fetch-macro.mjs || echo "macro fetch failed; using the committed files"
          node scripts/fetch-news.mjs macro || echo "macro news failed"

      - name: Fetch FX rates
        run: |
          node scripts/fetch-fx.mjs || echo "fx fetch failed; using the committed file"
          node scripts/fetch-news.mjs fx || echo "fx news failed"

      - name: Assemble site
        run: |
          mkdir -p _site/data _site/assets
          cp index.html .nojekyll _site/
          cp data/news.json _site/data/
          cp data/portfolios.json _site/data/
          cp data/macro.json data/macro-cal.json data/macro-news.json _site/data/
          mkdir -p _site/macro && cp macro/index.html _site/macro/
          cp data/fx.json data/fx-news.json _site/data/
          mkdir -p _site/fx && cp fx/index.html _site/fx/
          if [ -f data/portfolios-perf.json ]; then cp data/portfolios-perf.json _site/data/; fi
          cp assets/*.js assets/*.css _site/assets/
          for d in arm tesla sndk intc spcx mu lite cohr googl meta nvda zs be aaoi amd mp amzn msft mrvl skhy tsm avgo rok amat asml pltr glw ter; do
            mkdir -p _site/$d
            cp $d/index.html $d/fcf-data.js $d/ta.json _site/$d/
            cp -r $d/data _site/$d/
            if [ -f $d/holders.json ]; then cp $d/holders.json _site/$d/; fi
            if [ -f $d/vol.json ]; then cp $d/vol.json _site/$d/; fi
            if [ -f $d/analysts.json ]; then cp $d/analysts.json _site/$d/; fi
            if [ -f $d/mgmt.json ]; then cp $d/mgmt.json _site/$d/; fi
            if [ -f $d/unlocks.json ]; then cp $d/unlocks.json _site/$d/; fi
          done

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
